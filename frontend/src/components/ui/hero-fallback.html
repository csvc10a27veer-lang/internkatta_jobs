<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InternKatta Hero - HTML Fallback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* hero-fallback.css */
    :root {
      --tile: 160px;
      --gap: 16px;
      --container: 1100px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: #0F172A;
      background: #fff;
      overflow-x: hidden;
    }

    .hero {
      overflow-x: hidden;
      background: #fff;
      padding: 100px 0;
    }

    .container {
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 24px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: center;
    }

    @media (min-width: 1100px) {
      .hero-grid {
        grid-template-columns: 480px 1fr;
      }
    }

    .left {
      display: flex;
      align-items: center;
    }

    .left .label {
      color: #1E4ED8;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 12px;
      font-size: 12px;
      text-transform: uppercase;
    }

    .left h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 40px;
      font-weight: 700;
      margin: 0 0 16px;
      color: #0F172A;
      line-height: 1.2;
    }

    @media (max-width: 1023px) {
      .left h1 {
        font-size: 32px;
      }
    }

    @media (max-width: 639px) {
      .left h1 {
        font-size: 28px;
      }
    }

    .left p.sub {
      font-family: 'Inter', sans-serif;
      color: #6B7280;
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .cta {
      background: #2563EB;
      color: #fff;
      height: 48px;
      padding: 0 24px;
      border-radius: 50px;
      box-shadow: 0 12px 30px rgba(2, 6, 23, 0.06);
      border: none;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .cta:hover {
      background: #1E4ED8;
    }

    .cta:focus {
      outline: 3px solid #2563EB;
      outline-offset: 2px;
    }

    /* mosaic */
    .right {
      display: flex;
      justify-content: flex-end;
    }

    .mosaic {
      display: grid;
      grid-template-columns: repeat(3, var(--tile));
      gap: var(--gap);
      max-width: calc(3 * var(--tile) + 2 * var(--gap));
      width: calc(3 * var(--tile) + 2 * var(--gap));
      overflow: hidden;
    }

    /* base tile */
    .tile {
      width: var(--tile);
      height: var(--tile);
      border-radius: 12px;
    }

    /* variants */
    .circle {
      border-radius: 50%;
    }

    .square {
      border-radius: 12px;
    }

    .tallpill {
      width: var(--tile);
      height: 256px;
      border-radius: 12px 80px 80px 12px;
    }

    .tallarch {
      width: var(--tile);
      height: var(--tile);
      border-radius: 0 40px 40px 0;
    }

    .halfarch {
      width: var(--tile);
      height: var(--tile);
      border-radius: 80px 80px 0 0;
    }

    .widepill {
      width: var(--tile);
      height: 96px;
      border-radius: 999px;
    }

    .short {
      height: 96px;
    }

    .blob {
      border-radius: 36px;
    }

    /* colors */
    .red {
      background: #E94B3C;
    }

    .yellow {
      background: #F2C230;
    }

    .sky {
      background: #2EA3FF;
    }

    .deep {
      background: #3B33D6;
    }

    .teal {
      background: #2FB48A;
    }

    .pink {
      background: #FF3DA6;
    }

    .beige {
      background: #E9E0D4;
    }

    .purple {
      background: #5B3BD6;
    }

    /* stat tile */
    .stat {
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      text-align: center;
    }

    .stat .num {
      font-size: 22px;
    }

    .stat .subsmall {
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      margin-top: 4px;
    }

    /* reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .tile {
        animation: none !important;
      }
    }

    /* data-motion toggle */
    .hero[data-motion="off"] .tile {
      animation: none !important;
      transform: none !important;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="container">
      <div class="hero-grid">
        <div class="left">
          <p class="label">LEARN WITH INTERNKATTA</p>
          <h1>Unlock Your Potential with InternKatta</h1>
          <p class="sub">Your journey to a successful tech career starts here. Explore industry-relevant courses, hands-on internships, and specialized training programs.</p>
          <button class="cta">EXPLORE COURSES</button>
        </div>
        <div class="right">
          <div class="mosaic" aria-hidden="true">
            <!-- row 1 -->
            <div class="tile circle red"></div>
            <div class="tile square yellow"></div>
            <div class="tile tallpill sky"></div>
            <!-- row 2 -->
            <div class="tile square teal stat">
              <div class="num">10000+</div>
              <div class="subsmall">Students Trained</div>
            </div>
            <div class="tile circle sky"></div>
            <div class="tile tallarch deep"></div>
            <!-- row 3 -->
            <div class="tile square yellow"></div>
            <div class="tile halfarch pink"></div>
            <div class="tile square beige"></div>
            <!-- row 4 -->
            <div class="tile widepill sky short"></div>
            <div class="tile circle red stat">
              <div class="num">60+</div>
              <div class="subsmall">Expert instructors</div>
            </div>
            <div class="tile blob purple"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- QA Toggle Script -->
  <script>
    // Toggle animations for QA
    function toggleMotion(off) {
      const root = document.querySelector('.hero');
      if (!root) return;
      if (off) {
        root.setAttribute('data-motion', 'off');
      } else {
        root.setAttribute('data-motion', 'on');
      }
    }

    // Example: Disable animations
    // toggleMotion(true);
  </script>
</body>
</html>
